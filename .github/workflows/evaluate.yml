# CORD-v2 benchmark (protocol v2, docs/EVALUASI_V2.md).
#
# - dev: a push to a claude/** branch whose commit message contains [dev-validasi]
#   runs `docextract dev` on train + validation only (the test split cannot be read).
#   Results and caches go to the branch dev-cache/<branch>, never to the PR branch.
# - evaluate: started manually (results go to a new branch eval/run-<id>) or by a push
#   whose commit message contains [jalankan-evaluasi] (results are committed back to
#   that branch). `docextract all` scores the test split once, after every choice is
#   frozen on validation.
# - [dengan-transformer] in the commit message also fine-tunes the LayoutLM comparison
#   (Python only, CPU, about 1-2 hours).
name: Evaluasi CORD

on:
  workflow_dispatch:
    inputs:
      konfirmasi:
        description: "Ketik JALANKAN untuk memulai (split uji hanya boleh dipakai sekali per versi)"
        required: true
  push:
    branches: ["claude/**"]

permissions:
  contents: write

jobs:
  dev:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[dev-validasi]')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DOCEXTRACT_NO_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract + poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - run: pip install -e ".[dev]"
      - name: LayoutLM (opsional)
        if: contains(github.event.head_commit.message, '[dengan-transformer]')
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,transformer]"
          echo "TRANSFORMER_FLAG=--with-transformer" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: data
          key: cord-dev-${{ hashFiles('src/docextract/ocr.py', 'src/docextract/cord.py', 'web/public/tessdata/*') }}
          restore-keys: cord-dev-
      - name: Iterasi validasi (tanpa split uji)
        shell: bash
        run: |
          mkdir -p evaluation/v2
          set -o pipefail
          docextract dev --workers 4 $TRANSFORMER_FLAG 2>&1 | tee evaluation/v2/dev-log.txt
      - name: Simpan hasil dan cache ke cabang dev-cache
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/devcache"
          mkdir -p "$out/data/cache"
          cp -r evaluation/v2 "$out/evaluation-v2" || true
          cp web/public/model/model-n.json "$out/" || true
          cp -r data/cache/gt "$out/data/cache/" || true
          key=$(python -c "import json;from docextract.ocr import OcrConfig;print(OcrConfig.from_dict(json.load(open('evaluation/v2/config.json'))['ocr']).key)" || true)
          if [ -n "$key" ]; then mkdir -p "$out/data/cache/ocr" && cp -r "data/cache/ocr/$key" "$out/data/cache/ocr/"; fi
          echo "run ${{ github.run_id }} commit ${{ github.sha }}" > "$out/RUN.txt"
          cd "$out"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Cache pengembangan (validasi saja), run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/dev-cache/${{ github.ref_name }}"

  evaluate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.konfirmasi == 'JALANKAN') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[jalankan-evaluasi]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract + poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - run: pip install -e ".[dev]"
      - name: LayoutLM (opsional)
        if: contains(github.event.head_commit.message, '[dengan-transformer]')
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,transformer]"
          echo "TRANSFORMER_FLAG=--with-transformer" >> "$GITHUB_ENV"
      - name: Protokol lengkap
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evaluation/v2
          docextract all --workers 4 --n-boot 2000 --n-synth 200 $TRANSFORMER_FLAG 2>&1 | tee evaluation/v2/run-log.txt
      - name: Catat lingkungan
        if: always()
        run: |
          {
            echo "run_id: ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "date_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            tesseract --version 2>&1 | head -1
            python --version
            pip freeze | grep -iE "scikit-learn|crfsuite|numpy|pydantic|pytesseract|pillow|pyarrow|torch|transformers"
            sha256sum data/cord/*.parquet
          } > evaluation/v2/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluasi-${{ github.run_id }}
          path: |
            evaluation/
            web/public/model/
            web/public/data/
            web/public/samples/
      - name: Simpan hasil ke git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then target="${{ github.ref_name }}"; else target="eval/run-${{ github.run_id }}"; git checkout -b "$target"; fi
          git add evaluation web/public/model web/public/data web/public/samples
          git commit -m "Hasil evaluasi CORD v2 (run ${{ github.run_id }})"
          git push origin "HEAD:$target"
